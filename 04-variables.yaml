- name: variables to print
  hosts: web
  vars: #play level, all tasks in this play have access to this
    ROLE: "DEVOPS ENGINEER"
    EXPERIANCE: "3"
    NAME: "DEEPAK"
  tasks:
  - name: print the information
    ansible.builtin.debug:
     msg: "Hi i am {{NAME}}, and my experiance is {{EXPERIANCE}}years, and my role is {{ROLE}}"


- name: Variables to print
  hosts: web
  vars:
    COURSE: "DEVOPS WITH AWS"
    DURATION: "120HRS"
    TRAINER: "SHIVA KUMAR"
  tasks:
    - name: print the information
      ansible.builtin.debug:
        msg: "Hi, I am learning {{COURSE}}, Duration is {{DURATION}}, Trainer: {{TRAINER}}"




- name: variables
  hosts: web
  vars:
    COURSE: "DEVOPS"
    DURATION: 3
    TRAINER: "DEEPAK"
  tasks:
  - name: print 
    ansible.builtin.debug:
      msg: "HI i am learning {{ COURSE }} which will be of {{ DURATION }} and the trainer is {{ TRAINER }}
