- name: create ec2-instance
  hosts: local
  vars:
    subnet_id: "subnet-02956a72822d39e3d"
    sg_group: "sg-0eb6195b67d3d1e3b"
    ami_id: "ami-09c813fb71547fc4f"
    instances:
    - mysql
    - backend
    - frontend
  tasks:
  - name: create ec2-instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      security_group: "{{ sg_group }}"
      image_id: "{{ ami_id }}"
      instance_type: "t3.micro"
    loop: "{{ instances }}"
