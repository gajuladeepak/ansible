- name: create instances and create records
  hosts: local
  connections: local
  vars:
    subnet_id: "subnet-02956a72822d39e3d"
    security_group: "sg-02bcc52c5f8cdeff8"
    ami_id: "ami-09c813fb71547fc4f"
    instances:
    - mysql
    - frontend
    - backend
  tasks:
  - name: creating instances
    amazon.aws.ec2_instances:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      instance_type: "t3.micro"
      security_group: "{{ security_group }}"
      image_id: "{{ ami_id }}"
    loop: "{{ instances }}"
    register: ec2_instances

  - name: print the ec2_instances_info
    ansible.builtin.debug:
      msg: "info: {{ ec2_instances }}"
    



    
