- name: create instances and create records
  hosts: local
  connection: local
  vars:
    subnet_id: "subnet-02956a72822d39e3d"
    security_group: "sg-02bcc52c5f8cdeff8"
    ami_id: "ami-09c813fb71547fc4f"
    instances:
    - mysql
    - frontend
    - backend
    zone: "deepakaws.online"
  tasks:
  - name: creating instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      instance_type: "t3.micro"
      security_group: "{{ security_group }}"
      image_id: "{{ ami_id }}"
    loop: "{{ instances }}"
    register: ec2_instances

  - name: print the ec2_instances_info
    ansible.builtin.debug:
      msg: "info: {{ ec2_instances }}"

  - name: creating r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      ttl: 1
      type: A
      record: "{{ item.item }}.{{ zone_id }}"
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_instances.results }}"
  
  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ zone }}"
      type: "A"
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_instances.results }}"
    when: item.item == "frontend"
    



    
