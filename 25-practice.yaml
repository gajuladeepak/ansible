- name: check given number is greater than 10
  hosts: local
  connection: local
  vars_prompt:
    name: Number
    prompt: Please enter number
    private: false
  tasks:
  - name: if greater than 10
    ansible.builtin.debug:
      msg: "Hi the {{Number}} is grater than 10"
    when: Number | int > 10

  - name: if less than 10
    ansible.builtin.debug:
      msg: "Hi the {{Number}} is less than 10"
    when: Number | int < 10
