- name: create ec2-instance and r53 records
  hosts: local
  connection: local
  vars:
    sg_group: "sg-02bcc52c5f8cdeff8"
    subnet_id: "subnet-02956a72822d39e3d"
    ami_id: "ami-09c813fb71547fc4f"
    instances:
    - mysql
    - backend
    - frontend
    zone: "deepakaws.online"
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      instance_type: "t3.micro"
      security_group: "{{ sg_group }}"
      image_id: "{{ ami_id }}"
    loop: "{{ instances }}"
    register: ec2_instances

  - name: print the info
    ansible.builtin.debug:
      msg: "info: {{ ec2_instances }}"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      record: "{{ item.item }}.{{ zone }}"
      wait: true
      overwrite: true
    loop: "{{ ec2_instances.results }}"

  - name: create r53 records if it's frontend
    amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        record: "{{ item.item }}.{{ zone }}"
        wait: true
        overwrite: true
    loop: "{{ ec2_instances.results }}"
    when: item.item == "frontend"

  
