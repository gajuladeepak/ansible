- name: loops
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: print names
    ansible.builtin.package:
      name: "{{item.name}}"
      state: "{{item.state}}"
    loop:
    - { name: 'mysql', state: 'present'}
    - { name: 'nodejs', state: 'absent'}
    - { name: 'git', state: 'absent'}
